<div class="flex items-start justify-between py-4 border-b border-zinc-700/50 group">

    <div class="flex items-start gap-4 flex-1 cursor-pointer" (click)="view.emit(task.id)">
        <button (click)="$event.stopPropagation(); toggleComplete.emit(task.id)"
            class="mt-1 w-5 h-5 rounded-[3px] flex items-center justify-center shrink-0 transition-colors border"
            [ngClass]="task.isCompleted ? 'bg-indigo-500 border-indigo-500' : 'bg-transparent border-zinc-500 hover:border-indigo-400'">

            @if (task.isCompleted) {
            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            }
        </button>

        <div class="flex flex-col flex-1 gap-1">

            <div class="flex items-baseline gap-3">
                <span class="text-base font-bold tracking-wide transition-all"
                    [ngClass]="task.isCompleted ? 'text-zinc-500 line-through' : 'text-white'">
                    {{ task.title }}
                </span>

                <span class="text-[11px] text-zinc-500 font-medium">
                    {{ task.createdAt | date:'MMM d, yyyy' }}
                </span>
            </div>

            @if (task.note) {
            <p class="text-left text-sm text-zinc-400 line-clamp-2 mt-0.5 pr-4 break-all"
                [ngClass]="{'opacity-50 line-through': task.isCompleted}">
                {{ task.note }}
            </p>
            }

            <div class="flex flex-wrap items-center gap-2 mt-1">

                @if (task.dueTime) {
                <span class="flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-md transition-all"
                    [ngClass]="task.isCompleted ? 'bg-zinc-800 text-zinc-600' : 'bg-red-500/10 text-red-400 border border-red-500/20'">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    {{ task.dueTime | date:'MMM d, HH:mm' }}
                </span>
                }

                @for (category of task.taskCategories; track category.id) {
                <span
                    class="px-2 py-0.5 bg-zinc-700/50 text-zinc-300 text-[10px] rounded-md border border-zinc-600/50 uppercase tracking-wider transition-all"
                    [ngClass]="{'opacity-50': task.isCompleted}">
                    {{ category.name }}
                </span>
                }

            </div>
        </div>
    </div>

    <div class="flex items-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity ml-4 shrink-0 mt-1">
        <button (click)="edit.emit(task.id)" class="text-zinc-500 hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                </path>
            </svg>
        </button>

        <button (click)="delete.emit(task.id)" class="text-zinc-500 hover:text-red-400 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
            </svg>
        </button>

    </div>
</div>
