<form [formGroup]="filterForm" class="flex items-center gap-4 w-full max-w-4xl mx-auto">

    <div class="relative flex-1">
        <input type="text" formControlName="title" placeholder="Search your task..."
            class="w-full bg-transparent border border-zinc-500 rounded-md py-2 pl-4 pr-10 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors">
        <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-400" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
    </div>

    <div class="relative">
        <button type="button" (click)="toggleCategoryMenu()"
            class="flex items-center gap-2 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold text-sm uppercase py-2 px-4 rounded-md cursor-pointer outline-none transition-colors">
            <span>
                @if (filterForm.value.categoryIds.length === 0) {
                ALL CATEGORIES
                } @else {
                SELECTED ({{ filterForm.value.categoryIds.length }})
                }
            </span>

            <svg class="w-4 h-4 transition-transform" [class.rotate-180]="isCategoryMenuOpen" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>

        @if (isCategoryMenuOpen) {
        <div
            class="absolute top-full right-0 mt-2 w-56 bg-zinc-800 border border-zinc-600 rounded-md shadow-xl py-2 z-50">

            @if (filterForm.value.categoryIds.length > 0) {
            <button type="button" (click)="filterForm.patchValue({ categoryIds: [] })"
                class="w-full text-left px-4 py-2 text-xs text-zinc-400 hover:text-white hover:bg-zinc-700 uppercase tracking-wider mb-1">
                Clear Selection
            </button>
            }

            <div class="max-h-60 overflow-y-auto custom-scrollbar">
                @for (category of categories; track category.id) {
                <label
                    class="flex items-center gap-3 px-4 py-2 hover:bg-zinc-700 cursor-pointer text-sm text-white transition-colors">
                    <input type="checkbox" [checked]="filterForm.value.categoryIds.includes(category.id)"
                        (change)="toggleCategory(category.id)"
                        class="w-4 h-4 text-indigo-500 bg-zinc-900 border-zinc-500 rounded focus:ring-indigo-500 focus:ring-2">
                    <span class="truncate">{{ category.name }}</span>
                </label>
                }
            </div>
        </div>
        }
    </div>

    <div class="relative">
        <select formControlName="isCompleted"
            class="appearance-none bg-indigo-500 hover:bg-indigo-600 text-white font-semibold text-sm uppercase py-2 pl-4 pr-8 rounded-md cursor-pointer outline-none transition-colors">
            <option [ngValue]="null">ALL STATUS</option>
            <option [ngValue]="true">DONE</option>
            <option [ngValue]="false">TODO</option>
        </select>
        <svg class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 text-white pointer-events-none" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </div>

    <div class="relative">
        <select formControlName="pageSize"
            class="appearance-none bg-indigo-500 hover:bg-indigo-600 text-white font-semibold text-sm uppercase py-2 pl-4 pr-8 rounded-md cursor-pointer outline-none transition-colors">
            <option [ngValue]="5">5</option>
            <option [ngValue]="25">25</option>
            <option [ngValue]="100">100</option>
        </select>
        <svg class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 text-white pointer-events-none" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </div>

</form>
