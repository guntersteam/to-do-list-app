@if (toastService.toast$ | async; as toast) {
<div class="fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 animate-fade-in-up"
    [ngClass]="{
          'bg-emerald-500': toast.type === 'success',
          'bg-red-500': toast.type === 'error'
        }">
    {{ toast.message }}
</div>
}
