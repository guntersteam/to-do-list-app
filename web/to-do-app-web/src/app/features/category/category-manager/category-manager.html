<div class="flex flex-col gap-6">

    <div class="flex gap-2">
        <input type="text" [(ngModel)]="newCategoryName" placeholder="New category name..."
            class="flex-1 bg-zinc-900 border border-zinc-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500 transition-colors">
        <button (click)="onAdd()" [disabled]="!newCategoryName.trim()"
            class="bg-indigo-500 hover:bg-indigo-600 disabled:bg-zinc-700 disabled:text-zinc-500 text-white font-bold py-2 px-4 rounded-md transition-colors">
            ADD
        </button>
    </div>

    <div
        class="flex flex-col border border-zinc-700 rounded-md bg-zinc-900/50 overflow-hidden max-h-[300px] overflow-y-auto custom-scrollbar">
        @if (categories.length === 0) {
        <p class="text-zinc-500 text-center py-6 text-sm">No categories found.</p>
        }

        @for (category of categories; track category.id) {
        <div
            class="flex items-center justify-between p-3 border-b border-zinc-700/50 last:border-0 hover:bg-zinc-800 transition-colors">
            <span class="text-white text-sm font-medium">{{ category.name }}</span>
            <button (click)="delete.emit(category.id)" class="text-zinc-500 hover:text-red-400 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
        }
    </div>

</div>
