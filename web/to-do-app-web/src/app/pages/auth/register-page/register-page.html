<h2 class="text-2xl font-bold text-white mb-6 tracking-wider">Registration</h2>

<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-y-4">

    <app-auth-input type="email" placeholder="Enter email" [control]="registerForm.get('email')">
    </app-auth-input>

    <app-auth-input type="text" placeholder="Enter username" [control]="registerForm.get('username')">
    </app-auth-input>

    <app-auth-input type="password" placeholder="Enter password" [control]="registerForm.get('password')">
    </app-auth-input>

    <a routerLink="/auth/login" class="text-[10px] text-white mt-2 hover:underline tracking-wider cursor-pointer">
        Already have an account? Login
    </a>

    <button type="submit" [disabled]="registerForm.invalid"
        class="mt-4 px-8 py-2 text-white text-sm font-semibold rounded-md mx-auto transition-colors cursor-pointer"
        [class.bg-indigo-500]="registerForm.valid" [class.hover:bg-indigo-600]="registerForm.valid"
        [class.bg-zinc-600]="registerForm.invalid" [class.cursor-not-allowed]="registerForm.invalid">
        Register
    </button>

</form>
